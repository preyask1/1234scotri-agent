# ADF factory registry — which Azure Data Factory instance (subscription / resource group / factory
# name) backs the pipeline/activity/trigger run-history readers. Prod only: Dev run history is not
# read. A pipeline run lives in one factory, so `--factory` must name the factory that owns it.
#
# The factories and ids below are placeholders for the fictional Acme Retail platform. A factory with
# an empty subscription_id/resource_group returns a ConfigurationError for `--factory`, not an ARM
# error, so a half-filled row fails loudly and safely.

factories:
  - environment: prod
    subscription_id: "00000000-0000-0000-0000-000000000000"
    resource_group: rg-acme-data
    factory_name: acme-adf-prod
    default: true               # what `pipeline-runs` etc. query when --factory is omitted

  - environment: prod
    subscription_id: ""         # fill in: Azure portal > the factory > Properties
    resource_group: ""
    factory_name: acme-ingest-adf

  - environment: prod
    subscription_id: ""
    resource_group: ""
    factory_name: acme-analytics-adf
